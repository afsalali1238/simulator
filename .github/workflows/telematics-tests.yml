# ─────────────────────────────────────────────────────────────────────────────
# telematics tests — the P0 merge gate.
#
# Runs the suite in MEMORY mode, which needs no services, no secrets, and no
# `npm install`: `pg` is only imported on the Postgres path, so the whole
# pipeline and every invariant that can be proven at the application layer run
# on a bare runner. That is the entire point of the two-adapter design.
#
# The gate is `npm run test:gate`, not a bare `npm test`. It additionally fails
# when the test COUNT drops below the floor or when anything is skipped/todo —
# the two ways a suite silently retires an invariant's proof. See
# src/tools/test-gate.js.
#
# This file sits at the repository root's `.github/workflows/`, which is the only
# place GitHub Actions reads workflows from. gps-build IS its own repo
# (github.com/afsalali1238/simulator) — that decision is settled; the docs' "zip
# this folder and hand it to a dev team" model is what it implements. If this
# slice is ever vendored into a larger repo instead, this file must move to that
# repo's root and every `working-directory` below gains a `gps-build/` prefix.
# ─────────────────────────────────────────────────────────────────────────────
name: telematics tests

on:
  push:
  pull_request:

# Don't burn runners on superseded pushes to the same branch.
concurrency:
  group: telematics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    name: memory mode (P0 gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telematics
    strategy:
      fail-fast: false
      matrix:
        # 20 is the documented floor in package.json engines; 22 is what the
        # slice was built on. Both must stay green.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install on purpose: memory mode has ZERO runtime dependencies (`pg` is
      # dynamic-imported only on the Postgres path), so a bare runner can prove the
      # whole pipeline. Installing here would only prove the npm registry is up.
      # The lockfile IS committed — the `postgres` job below uses `npm ci`.
      - name: Show environment
        run: |
          node --version
          echo "store mode: memory (default)"

      - name: Test gate (floor + no skips, serial)
        run: npm run test:gate

      - name: Demo — end-to-end proof on live data
        run: npm run demo

      - name: Replay the handover scenario against a live ingestion server
        run: |
          node src/ingestion/server.js &
          INGEST_PID=$!
          # Wait for the TCP port instead of sleeping blindly.
          for i in $(seq 1 40); do
            if node -e "require('node:net').connect(5027,'127.0.0.1').on('connect',function(){this.destroy();process.exit(0)}).on('error',()=>process.exit(1))"; then
              break
            fi
            sleep 0.25
          done
          npm run sim -- --scenario handover --interval 0
          # SIGTERM must drain cleanly and exit 0 (P0 graceful shutdown).
          kill -TERM $INGEST_PID
          wait $INGEST_PID
        env:
          LOG_FORMAT: kv

  postgres:
    name: postgres mode (P1 gate)
    runs-on: ubuntu-latest
    # Proves RLS and the immutability trigger in the database itself — the P1
    # gate. Opt-in so a Postgres outage can never block a memory-mode merge:
    # triggers on workflow_dispatch or a '[pg]' commit message.
    # NOTE: the credentials here are the throwaway local-dev roles from
    # docker-compose.yml / db/schema.sql (dozr / dozr_app), not secrets.
    # APP_DATABASE_URL must point at the RESTRICTED role — if it fell back to
    # the owner, RLS would be bypassed and test/rls.test.js's role guard
    # (no SUPERUSER, no BYPASSRLS) would correctly fail the job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[pg]')
    continue-on-error: true
    defaults:
      run:
        working-directory: telematics
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: dozr
          POSTGRES_PASSWORD: dozr
          POSTGRES_DB: dozr_telematics
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://dozr:dozr@localhost:5432/dozr_telematics
      APP_DATABASE_URL: postgres://dozr_app:dozr_app@localhost:5432/dozr_telematics
      DB: pg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run db:reset
      - run: npm run test:gate
      - run: npm run demo
